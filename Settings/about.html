<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>About Welcome</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <script>


    function polyAudio(path, poolSize = 16) {
      const elems = [];
      let index = 0;
      for (let i = 0; i < poolSize; i++) {
        elems.push(new Audio(path));
      }
      return {
        play() {
          const audio = elems[index];
          if (!audio) {
            console.error('Audio element undefined at index', index);
            return;
          }
          if (window.chrome) audio.load();
          audio.play().catch(e => {
            console.warn('Audio play failed:', e);
          });
          index = (index + 1) % poolSize;
        }
      };
    }

    
    const hover = polyAudio('snd/hover.mp3');

    
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('a').forEach(el => {
        el.addEventListener('mouseover', () => hover.play());
      });
    });

document.addEventListener('click', () => {
  const menuAudio = document.getElementById('menu');
  if (menuAudio.muted) {
    menuAudio.muted = false;
    menuAudio.play();
  }
}, { once: true });
</script>

</head>
<body>
  <h1>About Welcome</h1>
  <div class="abouttext" style="color: white; font-size: 28px; text-align: center;">
	<p>
	Welcome Menu<br>
	Version 1.0rev2<br>
	Released: 03/07/2026<br>
	</p>
	<p>
	Welcome is a weird slide show created by Isaac The Nerd (isaacneosoap) and Gertie the Groundhog.<br>
	This website is place to access Welcome in addition to many other things.<br>
	See Credits or the Message Board for more info.
	</p>
  </div>
  <button class="back-button" onclick="location.href='settings.html'">Back</button>
</body>

<audio src="snd/menu.mp3" loop id="menu" autoplay></audio>

</html>
