<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome GPeeTea</title>
    <style>
        :root {
            --bg: #0b0f14;
            --panel: #11161d;
            --accent: #23c55e;
            --muted: #9aa4af;
            --text: #e6ebf0;
            --user: #1f2937;
            --bot: #0f1720;
            --ring: rgba(35, 197, 94, 0.35);
        }

        /* Layout */
        html, body {
            height: 100%;
        }
        body {
            margin: 0;
            background: radial-gradient(1200px 600px at 20% -10%, #122233 0%, transparent 60%),
                        radial-gradient(900px 600px at 110% 10%, #0f1b2a 0%, transparent 60%),
                        var(--bg);
            color: var(--text);
            font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        /* Header */
        header {
            border-bottom: 1px solid #1a2430;
            background: linear-gradient(180deg, #0f1520, #0c131b);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: conic-gradient(from 0deg, #23c55e, #22a6f2, #8b5cf6, #23c55e);
            box-shadow: 0 0 0 2px #0e1621 inset;
        }
        .brand {
            font-weight: 700;
            letter-spacing: 0.2px;
        }
        .brand small {
            color: var(--muted);
            font-weight: 500;
            margin-left: 6px;
        }

        /* Chat area */
        .chat {
            padding: 20px 16px 0 16px;
            overflow-y: auto;
        }
        .bubble {
            max-width: 820px;
            margin: 0 auto 14px auto;
            display: grid;
            grid-template-columns: 40px 1fr;
            gap: 12px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            background: #0c1420;
            display: grid;
            place-items: center;
            color: var(--muted);
            font-weight: 700;
        }
        .msg {
            background: var(--bot);
            border: 1px solid #1a2430;
            padding: 12px 14px;
            border-radius: 12px;
            box-shadow: 0 0 0 1px rgba(255,255,255,0.02) inset;
            word-wrap: break-word;
            overflow-wrap: anywhere;
        }
        .user .msg {
            background: var(--user);
        }
        .meta {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 6px;
        }

        /* Composer */
        .composer-wrap {
            border-top: 1px solid #1a2430;
            background: linear-gradient(180deg, #0c121a, #0b1118);
            padding: 12px 16px 16px 16px;
        }
        .composer {
            max-width: 820px;
            margin: 0 auto;
            background: var(--panel);
            border: 1px solid #1c2632;
            border-radius: 14px;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            padding: 8px;
            box-shadow: 0 0 0 2px transparent;
        }
        .composer:focus-within {
            box-shadow: 0 0 0 2px var(--ring);
            border-color: #244055;
        }
        textarea {
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            min-height: 48px;
            max-height: 180px;
            padding: 8px 10px;
            font: inherit;
        }
        .actions {
            display: flex;
            align-items: end;
            gap: 8px;
        }
        button {
            border: 1px solid #234;
            background: linear-gradient(180deg, #1a2633, #121a24);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .hint {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            margin-top: 8px;
        }

        /* Tiny screen tweaks */
        @media (max-width: 520px) {
            header { padding: 10px 12px; }
            .chat { padding: 14px 12px 0 12px; }
            .composer-wrap { padding: 10px 12px 12px 12px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo" aria-hidden="true"></div>
        <div class="brand">
            Welcome GPeeTea
            <small>definitely not ChatGPT</small>
        </div>
    </header>

    <main id="chat" class="chat" aria-live="polite" aria-atomic="false"></main>

    <div class="composer-wrap">
        <form id="form" class="composer">
            <textarea id="input" placeholder="Ask anything. GPeeTea will boldly not know it..." autocomplete="off"></textarea>
            <div class="actions">
                <button id="send" type="submit">Send</button>
            </div>
        </form>
        <div class="hint">Fun fact: This was made by ChatGPT.</div>
    </div>

    <script>
        /* Utilities */
        function escapeHTML(str) {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function timeNow() {
            const d = new Date();
            return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function el(html) {
            const template = document.createElement('template');
            template.innerHTML = html.trim();
            return template.content.firstElementChild;
        }

        const chat = document.getElementById('chat');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');

        /* Initial system message */
        chat.appendChild(el(`
            <div class="bubble bot">
                <div class="avatar" aria-hidden="true">🤖</div>
                <div class="msg">
                    <div class="meta">GPeeTea • ${timeNow()}</div>
                    <div>Welcome to <strong>Welcome GPeeTea</strong> — the large language model that knows everything.</div>
                </div>
            </div>
        `));
        chat.scrollTop = chat.scrollHeight;

        /* Core behavior: ALWAYS reply with the same template including the user's prompt */
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const raw = input.value.trim();
            const safe = escapeHTML(raw || 'that');
            if (!raw) {
                // Still show a user bubble to keep the joke consistent
                addUserBubble('(empty message)');
            } else {
                addUserBubble(safe);
            }
            input.value = '';
            input.style.height = '48px';

            sendBtn.disabled = true;
            const typing = addTyping();

            // Simulated thinking delay so it feels like a chat app
            await new Promise(r => setTimeout(r, 500 + Math.random() * 700));

            typing.remove();
            addBotBubble(`As an AI language model, I don't know what ${safe} is.`);
            sendBtn.disabled = false;
            input.focus();
        });
		
		

        /* Autosize the textarea */
        input.addEventListener('input', () => {
            input.style.height = '48px';
            input.style.height = Math.min(input.scrollHeight, 180) + 'px';
        });

        /* Render helpers */
        function addUserBubble(content) {
            chat.appendChild(el(`
                <div class="bubble user">
                    <div class="avatar" aria-hidden="true">🧑</div>
                    <div class="msg">
                        <div class="meta">You • ${timeNow()}</div>
                        <div>${content}</div>
                    </div>
                </div>
            `));
            chat.scrollTop = chat.scrollHeight;
        }

        function addBotBubble(content) {
            chat.appendChild(el(`
                <div class="bubble bot">
                    <div class="avatar" aria-hidden="true">🤖</div>
                    <div class="msg">
                        <div class="meta">GPeeTea • ${timeNow()}</div>
                        <div>${content}</div>
                    </div>
                </div>
            `));
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const node = el(`
                <div class="bubble bot" id="typing">
                    <div class="avatar" aria-hidden="true">🤖</div>
                    <div class="msg">
                        <div class="meta">GPeeTea • ${timeNow()}</div>
                        <div aria-live="polite"><em>thinking really hard about not knowing…</em></div>
                    </div>
                </div>
            `);
            chat.appendChild(node);
            chat.scrollTop = chat.scrollHeight;
            return node;
        }
    </script>
</body>
</html>
