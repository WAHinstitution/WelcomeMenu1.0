<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Meme Maker</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<h1>Meme Maker</h1>
	<input type="file" id="imageInput" accept="image/*"><br>
	<input type="text" id="topText" placeholder="Top text"><br>
	<input type="text" id="bottomText" placeholder="Bottom text"><br>
	<button id="generateBtn">Generate Meme</button>
	<button id="downloadBtn">Download Meme</button><br><br>
	<button id="resetBtn">Reset</button>

	<canvas id="memeCanvas" width="500" height="500"></canvas>

	<script src="script.js"></script>
</body>
<audio src="snd/bgm.mp3" loop id="menu" autoplay></audio>
</html>
